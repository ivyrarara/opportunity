# 임시 진단 — Vaughan njoyn 실제 응답 확인용. 1회 실행 후 제거.
name: njoyn-diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Probe Vaughan njoyn
        run: python scripts/diag_njoyn.py
