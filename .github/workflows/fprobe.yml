name: fprobe

on:
  workflow_dispatch:

jobs:
  fprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install httpx
        run: pip install httpx
      - name: Probe foreign
        run: python scripts/probe_foreign.py
