# 잡코리아 접속 진단 (임시) — 러너 IP + 잡코리아 직접 접속을 2시간마다 기록.
# 목적: 차단이 IP 대역 룰렛인지 / 시간대인지 / 하드 차단인지 하루치 데이터로 판정.
# 판정 끝나면 이 워크플로우와 scripts/diag_jk.py 는 삭제한다.
name: jk-diag

on:
  schedule:
    - cron: "0 */2 * * *"     # 2시간마다 (하루 12포인트: IP 다양성 + 시간대 스프레드)
  workflow_dispatch:

concurrency:
  group: jk-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python scripts/diag_jk.py
