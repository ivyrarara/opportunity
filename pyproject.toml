[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opmon"
version = "0.1.0"
description = "Opportunity monitor — 관심 카테고리 신규 공고 알림 (개인 용도)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",           # HTTP 취득 + 텔레그램 전송
    "beautifulsoup4>=4.12",  # HTML 파싱(§6-5 추출기)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# 운영(배포) 시에만 필요. 오프라인 개발/테스트에는 불필요.
firestore = [
    "google-cloud-firestore>=2.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
